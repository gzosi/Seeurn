[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seeurn"
version = "0.1.0"
description = "3D Tip Vortex Cavitation Reconstruction and Dynamics in High-Speed Naval Video"
readme = "README.md"
authors = [
    { name = "Giovanni Franzosi", email = "giova.franz96@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "scipy>=1.11.0",
    "scikit-image>=0.21.0",
    "networkx>=3.1",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
